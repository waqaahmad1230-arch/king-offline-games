<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh}canvas{background:#222;border:2px solid #0f0}</style></head>
<body><canvas id="c" width="300" height="300"></canvas>
<script>
let s=[{x:10,y:10}],d={x:1,y:0},f={x:5,y:5};let C=document.getElementById('c').getContext('2d');
function loop(){let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.x>19||h.y<0||h.y>19||s.some(p=>p.x==h.x&&p.y==h.y))s=[{x:10,y:10}];else{s.unshift(h);if(h.x==f.x&&h.y==f.y)f={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};else s.pop();}C.fillStyle='#222';C.fillRect(0,0,300,300);C.fillStyle='#0f0';s.forEach(p=>C.fillRect(p.x*15,p.y*15,14,14));C.fillStyle='red';C.fillRect(f.x*15,f.y*15,14,14);}setInterval(loop,120);
window.addEventListener('keydown',e=>{if(e.key=='ArrowUp'&&d.y==0)d={x:0,y:-1};if(e.key=='ArrowDown'&&d.y==0)d={x:0,y:1};if(e.key=='ArrowLeft'&&d.x==0)d={x:-1,y:0};if(e.key=='ArrowRight'&&d.x==0)d={x:1,y:0};});
let sx,sy;window.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
window.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&d.x==0)d={x:1,y:0};else if(d.x==0)d={x:-1,y:0}}else{if(dy>0&&d.y==0)d={x:0,y:1};else if(d.y==0)d={x:0,y:-1}}});
</script></body></html>
